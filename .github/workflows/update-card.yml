name: Atualizar cartão do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia, 06:00 UTC
  workflow_dispatch:       # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar assets/hello.svg
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python3 scripts/build_card.py
      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hello.svg
          git diff --cached --quiet || git commit -m "chore: atualiza cartão do perfil"
          git push
